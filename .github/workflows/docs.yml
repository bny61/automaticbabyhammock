name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install mkdocs mkdocs-material

      # The requirement rules are enforced in CI, not only by convention.
      - name: Lint requirements
        run: python tools/check_requirements.py

      - name: Self-test the linter
        run: python tools/check_requirements.py --self-test

      - name: Check the traceability matrix is up to date
        run: python tools/gen_traceability.py --check

      - name: Build docs
        run: mkdocs build --strict

      # Always downloadable from the run summary, whether or not Pages is enabled.
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # GitHub Pages on a PRIVATE repository requires a paid plan. Until then this job
  # is skipped rather than failing. To enable: upgrade the plan, set Settings >
  # Pages > Source to "GitHub Actions", then add repository variable
  # ENABLE_PAGES=true (gh variable set ENABLE_PAGES --body true).
  deploy:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
