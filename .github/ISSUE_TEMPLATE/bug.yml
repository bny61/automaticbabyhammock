name: "Bug"
description: "Something is wrong"
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Cite the requirement ID it violates, if there is one.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: dropdown
    id: safety
    attributes:
      label: Could this cause harm?
      options: ["No", "Possibly - needs assessment", "Yes - raise a hazard issue as well"]
    validations: { required: true }
