name: "Design decision (ADR)"
description: "Raise a decision that needs recording"
title: "[ADR] "
labels: ["type:adr"]
body:
  - type: textarea
    id: question
    attributes:
      label: The decision
      description: One sentence. What must be decided?
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now? What forces the decision, and what happens if it is not made?
    validations: { required: true }
  - type: textarea
    id: options
    attributes:
      label: Options
      description: "At least two. A decision with one option is not a decision."
    validations: { required: true }
  - type: input
    id: affects
    attributes:
      label: Requirements affected
  - type: checkboxes
    id: gate
    attributes:
      label: Before opening the ADR
      options:
        - label: "This needs a trade study first (comparison across weighted criteria)"
        - label: "No accepted ADR will be edited - a superseding ADR will be written if needed"
